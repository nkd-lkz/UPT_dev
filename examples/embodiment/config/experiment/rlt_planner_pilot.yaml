# @package _global_
# Engineering pilot, NOT the formal 64-env baseline. Compare with assistance off.
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0
runner:
  max_epochs: 20
  max_steps: 20
  val_check_interval: 20
  save_interval: 20
  logger:
    log_path: ${oc.env:RLT_PLANNER_OUTPUT}
    project_name: rlinf-rlt-planner-pilot
    experiment_name: ${oc.env:RLT_PLANNER_NAME}
    logger_backends: [tensorboard]
algorithm:
  rlt_schedule:
    warmup_min_size: 128
    warmup_post_collect_updates: 512
    max_updates_per_train_step: 128
  replay_buffer:
    min_buffer_size: 128
    max_num_samples: 2000
    sample_window_size: 2000
    cache_size: 2000
  actor_weight_schedule:
    warmup_updates: 512
    ramp_updates: 512
env:
  train:
    total_num_envs: 1
    auto_reset: False
    ignore_terminations: False
    planner_assistance:
      enable: True
      approach_timeout: 180
      stall_ticks: 30
      min_progress: 0.003
      max_attempts: 1
      max_planner_ticks: 300
    rlt_policy_switch:
      expert_takeover:
        enable: False
    init_params:
      sim_backend: cpu
      render_backend: ${oc.env:RLT_PLANNER_RENDER_DEVICE}
  eval:
    total_num_envs: 1
    rollout_epoch: 20
    seed: 12026
    use_fixed_reset_state_ids: True
    evaluation_reset_seeds: [12026, 12027, 12028, 12029, 12030, 12031, 12032, 12033, 12034, 12035, 12036, 12037, 12038, 12039, 12040, 12041, 12042, 12043, 12044, 12045]
    planner_assistance:
      enable: False
    rlt_policy_switch:
      expert_takeover:
        enable: False
    video_cfg:
      save_video: False
    init_params:
      sim_backend: cpu
      render_backend: ${oc.env:RLT_PLANNER_RENDER_DEVICE}
rollout:
  expert_model: null
  rlt_feature_model:
    model_path: ${oc.env:RLT_STAGE1_ACTOR}
    openpi_data:
      repo_id: ${oc.env:RLT_DATASET_DIR}
      norm_stats_path: ${oc.env:RLT_DATASET_DIR}/norm_stats.json
    openpi:
      torch_compile: False
actor:
  micro_batch_size: 32
  global_batch_size: 64
