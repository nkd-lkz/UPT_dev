# GPU 2 atomic-decision research smoke; use run_rlt_atomic_gpu2.sh.
# Snapshot of the baseline AC config: do not use these budgets for convergence.
defaults:
  - env/maniskill_rlt@env.train
  - env/maniskill_rlt@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # RLinf enumerates physical hardware independently of CUDA_VISIBLE_DEVICES.
    actor: 2-2
    env: 2-2
    rollout: 2-2

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLT_SMOKE_RUN_DIR}
    project_name: rlinf-rlt-smoke
    experiment_name: "rlt_atomic_gpu2_smoke"
    logger_backends: ["tensorboard"]

  max_epochs: 2
  max_steps: 2
  only_eval: False
  weight_sync_interval: 1
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  rlt_schedule:
    enable: True
    max_updates_per_train_step: 2
    warmup_min_size: 4
    # Exercise updates on the first rollout, before online transition counting.
    warmup_post_collect_updates: 2
    train_every_episodes: 0
    train_every_transitions: 1
  group_size: 1

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  # RLT actor objective: -q_weight * Q + bc_weight * BC.
  q_weight: 1.0
  bc_weight: 1.0
  reference_dropout_prob: 0.5
  atomic_disagreement_weight: 0.0
  atomic_temperature: 0.1
  # Schedule for the BC/Q weights in the actor objective. Disable it to use
  # the fixed bc_weight and q_weight above for the entire run.
  actor_weight_schedule:
    enable: False
    warmup_updates: 20000
    ramp_updates: 50000
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.5
    online_q_weight: 0.45

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 64
    sample_window_size: 64
    max_num_samples: 256
    min_buffer_size: 4
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 1
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 2
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: False
    wrap_obs_mode: rlt_openpi_joint
    reward_mode: only_success
    rlt_policy_switch:
      enable: True
      task_mode: full_task
      trigger_mode: always_on
      latch_until_done: True
      auto_gate:
        require_grasp: True
        require_not_success: True
        near_hole_x_min: -0.16
        near_hole_yz_margin: 1.5
        fallback_hole_radius: 0.03
      expert_takeover:
        enable: False
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    action_dim: 8
    num_action_chunks: 10
    ref_num_action_chunks: 10
    init_params:
      id: "PegInsertionSideWideClearance-v1"
      sim_backend: "physx_cuda:0"
      render_backend: ${oc.env:RLT_SMOKE_RENDER_DEVICE}
      obs_mode: "rgb"
      control_mode: "pd_joint_delta_pos"
      reward_mode: "sparse"
      sim_config:
        sim_freq: 100
        control_freq: 10
      sensor_configs:
        width: 384
        height: 384
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    wrap_obs_mode: rlt_openpi_joint
    reward_mode: only_success
    rlt_policy_switch:
      enable: True
      task_mode: full_task
      trigger_mode: always_on
      latch_until_done: True
      auto_gate:
        require_grasp: True
        require_not_success: True
        near_hole_x_min: -0.16
        near_hole_yz_margin: 1.5
        fallback_hole_radius: 0.03
      expert_takeover:
        enable: False
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    policy_mode: eval
    group_size: 1
    action_dim: 8
    num_action_chunks: 10
    ref_num_action_chunks: 10
    video_cfg:
      save_video: False
      fps: 10
      record_every: 1
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: "PegInsertionSideWideClearance-v1"
      sim_backend: "physx_cuda:0"
      render_backend: ${oc.env:RLT_SMOKE_RENDER_DEVICE}
      obs_mode: "rgb"
      control_mode: "pd_joint_delta_pos"
      reward_mode: "sparse"
      sim_config:
        sim_freq: 100
        control_freq: 10
      sensor_configs:
        width: 384
        height: 384

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: True

  model:
    model_type: ${actor.model.model_type}
    model_path: ""
    precision: ${actor.model.precision}
    policy_setup: ${actor.model.policy_setup}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    fixed_std: ${actor.model.fixed_std}
    atomic_decision: ${actor.model.atomic_decision}
    is_lora: False
    lora_rank: 32

  rlt_feature_model:
    model_type: "openpi"
    model_path: ${oc.env:RLT_STAGE1_ACTOR}
    precision: bf16
    num_action_chunks: 10
    action_dim: ${actor.model.action_dim}
    num_steps: 5
    add_value_head: False
    is_lora: False
    lora_rank: 32
    openpi_data:
      repo_id: ${oc.env:RLT_DATASET_DIR}
      norm_stats_path: ${oc.env:RLT_DATASET_DIR}/norm_stats.json
      default_prompt: "insert the peg in the hole"
    openpi:
      task: eval
      torch_compile: False
      config_name: "pi05_rlt_maniskill_joint"
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 8
      num_steps: 5
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      train_expert_only: False
      add_value_head: False
      detach_critic_input: True
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

  # Null prevents loading a second OpenPI model, even with takeover disabled.
  expert_model: null

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 4
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_mlp_policy"
    # Empty: Stage2 MLP is trained from scratch. Do not point this at Stage1.
    model_path: ""
    # RLT AC keeps the small Stage2 head in fp32 for Q-learning stability.
    precision: fp32
    policy_setup: "panda-qpos"
    action_dim: 8
    num_action_chunks: 10
    ref_num_action_chunks: 10
    z_dim: 2048
    proprio_dim: 9
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    atomic_decision:
      enabled: True
      radius: 0.08
      reference_prior: 0.9
    is_lora: False
    lora_rank: 32

  optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # Preserve actor/critic parameter names for separate optimizers.
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
