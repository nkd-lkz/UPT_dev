    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start" x="35.1" y="36.0288" transform="rotate(-0 35.1 36.0288)">RLT + FLARE-inspired future representations</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #425466" x="35.1" y="60.4224" transform="rotate(-0 35.1 60.4224)">Implemented research variant | Stage 1B: predict observed futures</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(59.115 116.062289)">Frozen Stage 1 VLA</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(46.832969 128.065023)">RGB + language + qpos</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(262.66375 116.06268)">RL token z(t)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(247.510625 128.065414)">proprioception p(t)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(427.653437 116.06268)">Current encoder E</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(421.375312 128.065414)">e(t), 128 dimensions</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(620.5275 116.06268)">Actor / twin critics</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(613.59 128.065414)">original inputs + e(t)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #485466" x="562.41" y="104.22" transform="rotate(-0 562.41 104.22)">actor: stop-grad</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(51.59625 232.029312)">Executed action prefix</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(69.499375 244.032047)">a(t) ... a(t+h-1)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.904844 256.034781)">h = 1, 5, 10 offline</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(292.468437 232.029312)">Transformer</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(248.202812 244.032047)">[e(t), action tokens, query(h)]</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(265.890312 256.034781)">three prediction heads</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(483.208594 232.029312)">Predicted future</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(463.19375 244.032047)">RL token + joint change</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(466.728125 256.034781)">optional: LN(z) + delta</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(647.978125 238.03068)">Future alignment</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(642.552344 250.033414)">+ joint-change loss</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(497.795625 343.36668)">Actual future observation -&gt; same frozen VLA</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(489.939375 355.369414)">stop-gradient target; no future input at inference</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(86.029844 343.36668)">Stage 2: real replay -&gt; TD loss + future auxiliary loss</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(85.392344 355.369414)">Actor: Q + BC; frozen VLA; optional action bound OFF</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #485466" x="523.35" y="284.4" transform="rotate(-0 523.35 284.4)">prediction gradients</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #425466" x="35.1" y="405.2592" transform="rotate(-0 35.1 405.2592)">Future targets are frozen; online terminal rows are masked.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #425466" x="35.1" y="423" transform="rotate(-0 35.1 423)">Blue: frozen / targets     Green: trainable     Purple: observations / execution     Dashed: gradient path</text>
