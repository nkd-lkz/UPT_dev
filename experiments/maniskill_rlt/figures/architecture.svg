   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(250.568281 116.06268)">RL token + qpos</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(234.185469 128.065414)">reference action chunk</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(436.3875 116.06268)">Actor / twin critics</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(419.542187 128.065414)">original inputs + context</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(624.294219 116.06268)">Route and execute</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(618.518438 128.065414)">10-step action chunk</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(615.318438 232.029312)">Completed interaction</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(600.211406 244.032047)">start qpos, executed actions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(598.18875 256.034781)">actual change, terminal flags</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(400.983437 232.029312)">Per-environment memory</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(410.34125 244.032047)">recent 4 + archive 32</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(405.940469 256.034781)">retrieve 4 older records</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(205.608906 232.029703)">MLP + attention reader</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(199.641719 244.031656)">query = current raw qpos</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(204.924531 256.034391)">64-dimensional context</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #485466" x="367.11" y="162.7092" transform="rotate(-0 367.11 162.7092)">actor: stop-grad</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(67.590313 343.36668)">Replay stores decision-time raw memory snapshots</text>
