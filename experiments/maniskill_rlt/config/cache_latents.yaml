# Frozen Stage 1A -> offline features. Inference is an explicit separate command.
dataset_root: ${oc.env:RLT_DATASET}
cache_dir: ${oc.env:RLT_LATENT_CACHE}
seed: 2026
control_mode: pd_joint_delta_pos
control_freq: 10
feature_model:
  model_type: openpi
  model_path: ${oc.env:RLT_STAGE1_CHECKPOINT}
  precision: bf16
  num_action_chunks: 10
  action_dim: 8
  num_steps: 5
  add_value_head: False
  is_lora: False
  lora_rank: 32
  openpi_data:
    repo_id: ${oc.env:RLT_DATASET}
    norm_stats_path: ${oc.env:RLT_NORM_STATS}
    default_prompt: insert the peg in the hole
  openpi:
    task: eval
    config_name: pi05_rlt_maniskill_joint
    torch_compile: False
    num_images_in_input: 2
    action_chunk: 10
    action_horizon: 10
    action_env_dim: 8
    num_steps: 5
    model_action_dim: 32
    paligemma_variant: gemma_2b
    action_expert_variant: gemma_300m
    max_token_len: 200
    discrete_state_input: True
    train_expert_only: False
    add_value_head: False
    detach_critic_input: True
    use_rlt: True
    rlt_alpha: 1.0
    rlt_input_dim: 2048
    rlt_embed_dim: 2048
    rlt_prefix_seq_len: 1024
    rlt_num_layers: 2
    rlt_num_heads: 8
    rlt_mlp_ratio: 4.0
    rlt_encoder_type: append_self_attention
    rlt_image_only: False
    rlt_use_mask: True
